<ion-header>
  <ion-toolbar>
    <ion-title>Alta de Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <main id="main">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input type="email" formControlName="email" aria-required="true" [attr.aria-invalid]="form.get('email')?.invalid && form.get('email')?.touched"></ion-input>
      </ion-item>
      <ion-text color="medium" *ngIf="form.get('email')?.pending" aria-live="polite">
        <p>Comprobando...</p>
      </ion-text>
      <ion-text color="danger" *ngIf="form.get('email')?.errors?.['emailExists'] && form.get('email')?.touched" aria-live="polite">
        <p>El email ya existe</p>
      </ion-text>

      <ion-item>
        <ion-label position="stacked">Título</ion-label>
        <ion-input formControlName="title" aria-required="true" [attr.aria-invalid]="form.get('title')?.invalid && form.get('title')?.touched"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="form.get('title')?.invalid && form.get('title')?.touched" aria-live="polite">
        <p>Título requerido (mínimo 3 caracteres)</p>
      </ion-text>

      <ion-item>
        <ion-label position="stacked">Categoría</ion-label>
        <ion-input formControlName="category" aria-required="true" [attr.aria-invalid]="form.get('category')?.invalid && form.get('category')?.touched"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Importe</ion-label>
        <ion-input type="number" formControlName="amount" aria-required="true" [attr.aria-invalid]="form.get('amount')?.invalid && form.get('amount')?.touched"></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="form.invalid || form.pending" class="ion-margin-top">Guardar</ion-button>
    </form>
  </main>
</ion-content>
