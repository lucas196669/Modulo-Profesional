<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <main id="main">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input type="email" formControlName="email" aria-required="true" [attr.aria-invalid]="form.get('email')?.invalid && form.get('email')?.touched"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="form.get('email')?.invalid && form.get('email')?.touched" aria-live="polite">
        <p>Email inválido</p>
      </ion-text>

      <ion-item>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input type="password" formControlName="password" aria-required="true" [attr.aria-invalid]="form.get('password')?.invalid && form.get('password')?.touched"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="form.get('password')?.invalid && form.get('password')?.touched" aria-live="polite">
        <p>Contraseña requerida (mínimo 6 caracteres)</p>
      </ion-text>

      <ion-button expand="block" type="submit" [disabled]="form.invalid" class="ion-margin-top">Iniciar sesión</ion-button>
      <ion-text color="danger" *ngIf="error" aria-live="polite">
        <p>{{error}}</p>
      </ion-text>
    </form>
    <ion-text>
      <p>Usuarios de prueba:</p>
      <p>admin@demo.com / Admin123!</p>
      <p>user@demo.com / User123!</p>
    </ion-text>
  </main>
</ion-content>
