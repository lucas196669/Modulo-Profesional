<ion-header><ion-toolbar><ion-title>Login</ion-title></ion-toolbar></ion-header><ion-content class="ion-padding"><form [formGroup]="form" (ngSubmit)="submit()"><ion-item><ion-label position="stacked">Email</ion-label><ion-input type="email" formControlName="email"></ion-input></ion-item><ion-item><ion-label position="stacked">Password</ion-label><ion-input type="password" formControlName="password"></ion-input></ion-item><ion-button expand="block" type="submit" [disabled]="form.invalid">Login</ion-button><ion-text color="danger" *ngIf="error">{{error}}</ion-text></form></ion-content>
