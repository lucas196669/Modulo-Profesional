<ion-app>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar>
          <ion-title>Gestión Pro</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-item routerLink="/dashboard" routerDirection="root" *ngIf="auth.isLoggedIn()">
            <ion-icon slot="start" name="home"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
          <ion-item routerLink="/records" routerDirection="root" *ngIf="auth.isLoggedIn()">
            <ion-icon slot="start" name="document-text"></ion-icon>
            <ion-label>Registros</ion-label>
          </ion-item>
          <ion-item routerLink="/help" routerDirection="root">
            <ion-icon slot="start" name="help-circle"></ion-icon>
            <ion-label>Ayuda</ion-label>
          </ion-item>
          <ion-item routerLink="/auth/login" routerDirection="root" *ngIf="!auth.isLoggedIn()">
            <ion-icon slot="start" name="log-in"></ion-icon>
            <ion-label>Login</ion-label>
          </ion-item>
          <ion-item button (click)="auth.logout()" *ngIf="auth.isLoggedIn()">
            <ion-icon slot="start" name="log-in"></ion-icon>
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    <div class="ion-page" id="main-content">
      <a class="skip-link" href="#main">Saltar al contenido</a>
      <ion-router-outlet id="main"></ion-router-outlet>
    </div>
  </ion-split-pane>
</ion-app>
